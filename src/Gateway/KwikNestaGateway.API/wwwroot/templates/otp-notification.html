<!DOCTYPE html>
<html>
<body style="margin:0;background:#f4f7fb;font-family:Inter,Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="center" style="padding:40px 16px;">

                <table width="620" style="background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.06);">

                    <tr>
                        <td style="background:linear-gradient(90deg,#0f3b63,#1a5a94);height:6px;"></td>
                    </tr>

                    <tr>
                        <td style="padding:28px 40px;text-align:center;">
                            <img src="https://res.cloudinary.com/dctevxse1/image/upload/v1755309471/lbllx0uwgmgqucq8h83u.png" width="110" alt="{{APP_NAME}}" />
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:16px 40px;color:#4a5568;font-size:15px;line-height:1.7;">
                            Hi {{USER_NAME}},<br>
                            {{MESSAGE}}
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:28px 40px;">
                            <div style="
                                display:inline-block;
                                background:#f3f7fc;
                                border:1px solid #e2e8f0;
                                padding:18px 32px;
                                border-radius:10px;
                                font-size:28px;
                                letter-spacing:6px;
                                font-weight:700;
                                color:#0f3b63;
                                ">
                                {{OTP_CODE}}
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:0 40px 30px 40px;text-align:center;color:#7a8797;font-size:13px;">
                            This code expires in <strong>{{EXPIRATION_MINUTES}} minutes</strong>.
                        </td>
                    </tr>

                    <tr>
                        <td style="border-top:1px solid #eef2f7;"></td>
                    </tr>

                    <tr>
                        <td style="padding:24px 40px;text-align:center;">
                            <p style="margin:0;font-size:13px;color:#7a8797;">
                                {{SECURITY_NOTICE}}
                            </p>

                            <p style="margin-top:10px;font-size:12px;color:#9aa6b2;">
                                © {{YEAR}} {{APP_NAME}}. All rights reserved.<br><br>
                                Please do not reply to this email; replies to this address are not monitored.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>
</html>
